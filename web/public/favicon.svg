<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="royalBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#07080A"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE196"/>
      <stop offset="35%" stop-color="#E5A93C"/>
      <stop offset="70%" stop-color="#C58927"/>
      <stop offset="100%" stop-color="#8F5E12"/>
    </linearGradient>
    <linearGradient id="crownHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="100%" stop-color="#E5A93C"/>
    </linearGradient>
    <linearGradient id="silverBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#E5A93C" flood-opacity="0.35"/>
    </filter>
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.8" flood-color="#FFFFFF" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="32" height="32" rx="7" fill="url(#royalBg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#2B2D37" stroke-width="1"/>

  <!-- Subtle Ambient Glow Behind Emblem -->
  <circle cx="16" cy="16" r="9" fill="#E5A93C" opacity="0.08"/>

  <!-- Royal King Chess Piece (Gold) -->
  <g filter="url(#goldGlow)">
    <!-- Crown Cross / Finial -->
    <path d="M15.2 4h1.6v1.4h1.2v1.4h-1.2v1.4h-1.6v-1.4h-1.2V5.4h1.2z" fill="url(#crownHighlight)"/>

    <!-- Royal Crown Coronet -->
    <path d="M11 9.5 L12.5 13.5 L16 11 L19.5 13.5 L21 9.5 L22 14.5 L10 14.5 Z" fill="url(#goldGradient)"/>
    
    <!-- Crown Band & Collar Rings -->
    <rect x="10.5" y="14.8" width="11" height="1.4" rx="0.5" fill="url(#crownHighlight)"/>
    <rect x="11.5" y="16.5" width="9" height="1.2" rx="0.4" fill="url(#goldGradient)"/>

    <!-- Chess Piece Body / Pillar -->
    <path d="M12.2 18 L13 24 L19 24 L19.8 18 Z" fill="url(#goldGradient)"/>

    <!-- Pedestal Base Tier 1 & 2 -->
    <rect x="10.5" y="24.4" width="11" height="1.6" rx="0.6" fill="url(#crownHighlight)"/>
    <path d="M9 26.3 L10 26.3 L22 26.3 L23 26.3 L23.5 28 L8.5 28 Z" fill="url(#goldGradient)"/>
    <rect x="8" y="28.2" width="16" height="1.4" rx="0.5" fill="url(#crownHighlight)"/>
  </g>

  <!-- Dynamic Lightning Bolt (Metallic Silver Slash) -->
  <g filter="url(#boltGlow)">
    <polygon points="19.5,8 12.5,18.5 16.5,18.5 11,27.5 21,16.2 16.8,16.2" fill="url(#silverBolt)"/>
  </g>
</svg>
